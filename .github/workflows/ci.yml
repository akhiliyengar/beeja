name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check builder tests

      - name: Manifest is in sync
        run: |
          python -m skill._manifest --write
          git diff --exit-code builder/_manifest.json || (echo "FAIL: _manifest.json is stale. Run: python -m skill._manifest --write"; exit 1)

      - name: Dead-code scan
        run: python -m skill._dead_code

      - name: Tests
        run: python -m pytest -q

      - name: Validate TOML + YAML + Python parse
        run: |
          python - <<'PY'
          import ast, sys, tomllib
          from pathlib import Path
          errs = 0
          for f in Path('.').rglob('*.toml'):
              if '.venv' in f.parts or 'dist' in f.parts:
                  continue
              try: tomllib.loads(f.read_text())
              except Exception as e: print(f'TOML {f}: {e}'); errs += 1
          for f in Path('.').rglob('*.py'):
              if '.venv' in f.parts or 'dist' in f.parts:
                  continue
              try: ast.parse(f.read_text())
              except Exception as e: print(f'PY   {f}: {e}'); errs += 1
          sys.exit(errs)
          PY

      - name: Import + path-resolution smoke
        run: |
          python - <<'PY'
          import sys, types
          # Stub anthropic so we can import without an API key
          sys.modules['anthropic'] = types.SimpleNamespace(Anthropic=lambda *a, **kw: None)
          from skill import interview, draft, revise, SuccessSpec, InterviewState
          from skill.builder import load_prompt, load_template, load_properties_reference
          # The package data must be findable
          assert 'three-axis' in load_prompt('interview').lower() or 'three orthogonal' in load_prompt('interview').lower()
          assert 'phase-dependent scaffolding' in load_prompt('draft').lower()
          assert 'schema_validity' in load_properties_reference()
          import tomllib
          for k in ['sensor', 'transform', 'scorer', 'applier', 'meta']:
              parsed = tomllib.loads(load_template(k))
              assert 'success' in parsed, f'{k} template missing [success]'
              s = parsed['success']
              for axis in ('shape', 'specification', 'phase'):
                  assert axis in s, f'{k}[success] missing {axis}'
              props = s['properties']
              expected = {'schema_validity','bounded_cost','determinism','idempotence',
                          'refusal_symmetry','monotonicity','rephrase_stability','calibration'}
              assert expected <= set(props.keys()), f'{k} missing properties: {expected - set(props.keys())}'
          print('smoke OK')
          PY

      - name: Build wheel + sdist
        run: |
          pip install build
          python -m build

      - name: Inspect wheel contents
        run: |
          unzip -l dist/*.whl | tee /dev/stderr | grep -E '(prompts/|templates/|evals/).*\.(md|toml|yaml)$' > /tmp/data_files.txt
          test -s /tmp/data_files.txt || (echo "FAIL: package data missing from wheel"; exit 1)
